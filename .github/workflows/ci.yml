name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend (Python / pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Check if backend exists
        id: backend_check
        working-directory: ${{ github.workspace }}
        run: echo "exists=$(test -d backend && echo true || echo false)" >> $GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        if: steps.backend_check.outputs.exists == 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.backend_check.outputs.exists == 'true'
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        if: steps.backend_check.outputs.exists == 'true'
        run: |
          pytest tests/ -v --tb=short

      - name: Skip (backend not yet added)
        if: steps.backend_check.outputs.exists != 'true'
        run: echo "Backend directory not present — skipping. A teammate will add it via PR."

  frontend-build:
    name: Frontend (Node / Vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
